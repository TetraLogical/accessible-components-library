<div class="tl-text-input tl-text-input--error">
  <label for="input-1"> Full name </label>

  <p id="input-1-hint" class="hint-text">
    Your full name as it appears on your passport
  </p>

  <p class="error-message" id="input-1-error">
    <span class="visually-hidden">Error: </span>
    Enter your full name
  </p>

  <input
    id="input-1"
    type="text"
    autocomplete="name"
    aria-invalid="true"
    aria-describedby="input-1-hint input-1-error"
  />
</div>

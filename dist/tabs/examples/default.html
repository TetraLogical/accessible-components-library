<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs - Default</title>
    <style>
      /* -------------------------------------------------------------------------- */
      /* Boilerplate CSS                                                            */
      /* -------------------------------------------------------------------------- */

      /* Tokens base */
      :root {
        --tl-colour-white: #ffffff;
        --tl-colour-off-white: #f0f0eb;
        --tl-colour-black: #222222;
        --tl-colour-off-black: #333333;
      }

      /* Tokens light mode */
      body,
      [data-color-scheme-resolved="light"] body,
      [data-user-color-scheme="light"] body {
        /* Colour variables */
        --tl-colour-primary: #420065;
        --tl-colour-inclusive: #7f238b;
        --tl-colour-ethical: #cc0092;
        --tl-colour-sustainable: #ff1958;
        --tl-colour-original: #e06500;

        --tl-colour-grey: #666666;
        --tl-colour-bright: #ffc000;
        --tl-colour-error: #ca3535;

        /* Semantic variables */
        --tl-colour-page: var(--tl-colour-white);
        --tl-colour-surface: var(--tl-colour-off-white);
        --tl-colour-border: var(--tl-colour-grey);

        --tl-colour-text: var(--tl-colour-off-black);
        --tl-colour-text-link: var(--tl-colour-inclusive);
        --tl-colour-text-link-hover: var(--tl-colour-primary);

        --tl-colour-highlight-focus: var(--tl-colour-inclusive);
        --tl-colour-contrasting-focus: var(--tl-colour-page);

        --tl-colour-accent: var(--tl-colour-ethical);
      }

      /* Tokens dark mode */
      [data-color-scheme-resolved="dark"] body,
      [data-user-color-scheme="dark"] body {
        /* Colour variables */
        --tl-colour-primary: #e7d8ef;
        --tl-colour-inclusive: #cc81d6;
        --tl-colour-ethical: #ff0aba;
        --tl-colour-sustainable: #ff386d;
        --tl-colour-original: #f06c00;
        --tl-colour-grey: #8a8a8a;
        --tl-colour-bright: #ffc000;
        --tl-colour-error: #ff6a6a;

        /* Semantic variables */
        --tl-colour-page: var(--tl-colour-black);
        --tl-colour-surface: var(--tl-colour-off-black);
        --tl-colour-border: var(--tl-colour-grey);

        --tl-colour-text: var(--tl-colour-off-white);
        --tl-colour-text-link: var(--tl-colour-inclusive);
        --tl-colour-text-link-hover: var(--tl-colour-primary);

        --tl-colour-highlight-focus: var(--tl-colour-bright);
        --tl-colour-contrasting-focus: var(--tl-colour-black);

        --tl-colour-accent: var(--tl-colour-ethical);
      }

      /* Box sizing */
      html {
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }

      /* Bare minimum styling */
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: var(--tl-colour-text);
        background-color: var(--tl-colour-page);
      }

      p {
        max-inline-size: 60ch;
      }

      /* Utilities */
      .visually-hidden {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        color: var(--tl-colour-black);
        white-space: nowrap;
        background-color: var(--tl-colour-white);
        border: 0;
        clip: rect(0, 0, 0, 0);
      }
    </style>
    <style>
      /* -------------------------------------------------------------------------- */
      /* Tabs                                                                       */
      /* -------------------------------------------------------------------------- */

      tl-tabs {
        --colour-tab-selected-text: var(--tl-colour-primary, #420065);
        --colour-tab-selected-background: var(--tl-colour-page, #ffffff);
        --colour-tab-selected-highlight: var(--tl-colour-accent, #cc0092);
        --colour-tab-unselected-text: var(--tl-colour-text, #222222);
        --colour-tab-unselected-background: var(--tl-colour-surface, #f0f0eb);

        --colour-panel-text: var(--tl-colour-text, #222222);
        --colour-panel-background: var(--tl-colour-page, #ffffff);

        --colour-link-text: var(--tl-colour-text-link, #7f238b);

        --colour-border: var(--tl-colour-border, #666666);

        --colour-focus-highlight: var(--tl-colour-highlight-focus, #ffc000);
        --colour-focus-contrasting: var(--tl-colour-page, #ffffff);

        --border-width: 1px;
      }

      tl-tabs {
        display: block;
      }

      /* The row of tabs, shown when the element is wide enough */
      tl-tabs [role="tablist"] {
        display: flex;
        border-block-end: var(--border-width) solid var(--colour-border);
      }

      tl-tabs a[role="tab"] {
        display: inline-flex;
        flex-wrap: wrap;
        align-content: center;
        justify-content: center;
        min-inline-size: 44px;
        min-block-size: 44px;
        padding: 0.5rem 1rem;
        margin-block-end: calc(-1 * var(--border-width));
        color: var(--colour-tab-unselected-text);
        text-underline-offset: 0.2em;
        background-color: var(--colour-tab-unselected-background);
        border: var(--border-width) solid var(--colour-border);
      }

      tl-tabs a[role="tab"] + a[role="tab"] {
        margin-inline-start: calc(-1 * var(--border-width));
      }

      tl-tabs a[aria-selected="true"] {
        color: var(--colour-tab-selected-text);
        text-decoration: none;
        background-color: var(--colour-tab-selected-background);
        border-block-start: none;
        border-block-end: none;
        box-shadow: inset 0 3px 0 0 var(--colour-tab-selected-highlight);
      }

      /* The accordion toggles, shown instead of the tabs when the element is narrow.
   They match the triggers of the accordion component's one at a time variant */
      tl-tabs button.tl-tabs__toggle {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        inline-size: 100%;
        min-inline-size: 44px;
        min-block-size: 44px;
        padding: 0.5rem 1rem;
        margin-block-start: calc(-1 * var(--border-width));
        font: inherit;
        color: var(--colour-tab-unselected-text);
        text-align: start;
        cursor: pointer;
        background-color: var(--colour-tab-unselected-background);
        border: var(--border-width) solid var(--colour-border);
      }

      tl-tabs button.tl-tabs__toggle svg {
        flex: none;
        max-inline-size: 24px;
        max-block-size: 24px;
      }

      tl-tabs button.tl-tabs__toggle[aria-expanded="true"] {
        background-color: var(--colour-tab-selected-background);
        border-block-start: none;
        border-block-end: none;
        box-shadow: inset 0 2px 0 0 var(--colour-tab-selected-highlight);
      }

      tl-tabs button.tl-tabs__toggle[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }

      /* Forced colours drop box shadows and background colours, which takes away the
   accent stripe that marks the selected tab or the open section. Draw it as a
   thicker top border instead, and give the open section a line above its content */
      @media (forced-colors: active) {
        tl-tabs a[aria-selected="true"],
        tl-tabs button.tl-tabs__toggle[aria-expanded="true"] {
          border-block-start: 3px solid currentcolor;
        }

        tl-tabs button.tl-tabs__toggle[aria-expanded="true"] {
          border-block-end: var(--border-width) solid currentcolor;
        }
      }

      /* The content of a section, in either layout */
      tl-tabs .tl-tabs__panel {
        padding: 1rem;
        color: var(--colour-panel-text);
        background-color: var(--colour-panel-background);
        border: var(--border-width) solid var(--colour-border);
        border-block-start: none;
      }

      /* Focus styles */
      tl-tabs button.tl-tabs__toggle:focus-visible,
      tl-tabs a[role="tab"]:focus-visible {
        outline: 3px solid var(--colour-focus-contrasting);
        box-shadow: inset 0 0 0 3px var(--colour-focus-highlight);
      }

      /* Demo content */
      a.demo-link {
        color: var(--colour-link-text);
      }

      a.demo-link:focus-visible {
        outline: 3px solid var(--colour-focus-highlight);
        outline-offset: 3px;
        box-shadow: 0 0 0 6px var(--colour-focus-contrasting);
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Tabs</h1>

      <tl-tabs>
        <ul>
          <li>
            <a href="#panel-1-heading">Panel 1</a>
          </li>
          <li>
            <a href="#panel-2-heading">Panel 2</a>
          </li>
          <li>
            <a href="#panel-3-heading">Panel 3</a>
          </li>
        </ul>

        <h2 id="panel-1-heading">Panel 1</h2>
        <div>
          <p>
            The content for panel 1, with a focusable element for the
            <a class="demo-link" href="https://tetralogical.com"
              >TetraLogical website</a
            >.
          </p>
        </div>

        <h2 id="panel-2-heading">Panel 2</h2>
        <div>
          <p>Panel 2 content.</p>
        </div>

        <h2 id="panel-3-heading">Panel 3</h2>
        <div>
          <p>Panel 3 content.</p>
        </div>
      </tl-tabs>
    </main>

    <script>
      /* -------------------------------------------------------------------------- */
      /* Boilerplate JS                                                             */
      /* -------------------------------------------------------------------------- */

      // Record the resolved colour scheme on <html>, so the stylesheet can switch its
      // tokens. A page which sets data-user-color-scheme itself is left alone
      const darkMode = window.matchMedia("(prefers-color-scheme: dark)");

      function applyColourScheme() {
        if (document.documentElement.hasAttribute("data-user-color-scheme"))
          return;
        document.documentElement.setAttribute(
          "data-color-scheme-resolved",
          darkMode.matches ? "dark" : "light",
        );
      }

      darkMode.addEventListener("change", applyColourScheme);
      applyColourScheme();
    </script>
    <script>
      /**
       * Tabs
       *
       * The markup is a series of headings, each followed by the content of its
       * section, so it reads as plain sections without JavaScript. This script turns
       * it into a tablist with a tabpanel per section when the element is wider than
       * SWITCH_SIZE, and into an accordion of disclosures, one open at a time, when
       * it is narrower. It switches between the two layouts as the element is
       * resized, keeping the same section selected and moving focus to its control.
       */

      // The chevron on each accordion toggle, which the stylesheet turns when the section is open
      const CHEVRON =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m4 8 8 8 8-8" /></svg>';

      class TLTabs extends HTMLElement {
        // Below this width in pixels, the tabs render as an accordion
        static SWITCH_SIZE = 800;
        // Gives each instance without an id a unique name to build its ids from
        static instanceCount = 0;

        connectedCallback() {
          // Read the markup once only, in case the element is moved in the DOM
          if (!this.sections) {
            this.name = this.id || `tabs-${TLTabs.instanceCount++}`;
            this.currentIndex = 0;
            this.sections = this.findHeadings()
              .filter((heading) => heading.nextElementSibling)
              .map((heading) => ({
                label: heading.textContent.trim(),
                content: heading.nextElementSibling,
              }));
            this.resizeObserver = new ResizeObserver(() => this.updateLayout());
          }

          // Leave the markup as it is when there are no sections to work with
          if (!this.sections.length) return;

          this.updateLayout();
          this.resizeObserver.observe(this);
        }

        disconnectedCallback() {
          this.resizeObserver.disconnect();
        }

        // Sections start at the first heading level which appears more than once, or
        // failing that at the first heading level which appears at all
        findHeadings() {
          let fallback = [];
          for (const level of ["h1", "h2", "h3", "h4", "h5", "h6"]) {
            const headings = [...this.querySelectorAll(`:scope > ${level}`)];
            if (headings.length > 1) return headings;
            if (headings.length && !fallback.length) fallback = headings;
          }
          return fallback;
        }

        // Build whichever layout the width calls for, unless it is already showing.
        // When focus was inside the old layout it moves to the same section's control
        // in the new one
        updateLayout() {
          const layout =
            this.clientWidth > TLTabs.SWITCH_SIZE ? "tabs" : "accordion";
          if (layout === this.layout) return;

          const focusedIndex = this.contains(document.activeElement)
            ? this.focusedSectionIndex()
            : -1;

          this.layout = layout;
          if (layout === "tabs") {
            this.renderTabs();
          } else {
            this.renderAccordion();
          }

          if (focusedIndex !== -1) this.controls[focusedIndex].focus();
        }

        // The section whose control or content has focus, or the selected section
        // when focus is somewhere else inside the element
        focusedSectionIndex() {
          const active = document.activeElement;
          for (let i = 0; i < this.sections.length; i++) {
            if (this.controls[i] === active || this.panels[i].contains(active))
              return i;
          }
          return this.currentIndex;
        }

        renderTabs() {
          const tablist = document.createElement("div");
          tablist.className = "tl-tabs__tablist";
          tablist.setAttribute("role", "tablist");
          tablist.setAttribute("aria-orientation", "horizontal");

          this.controls = this.sections.map((section, index) => {
            const tab = document.createElement("a");
            tab.id = `${this.name}-tab-${index + 1}`;
            tab.href = `#${this.name}-panel-${index + 1}`;
            tab.textContent = section.label;
            tab.setAttribute("role", "tab");
            tab.setAttribute(
              "aria-controls",
              `${this.name}-panel-${index + 1}`,
            );

            tab.addEventListener("click", (event) => {
              // Select the tab rather than following its link to the panel
              event.preventDefault();
              this.selectTab(index);
            });
            tab.addEventListener("keydown", (event) =>
              this.onTabKeydown(event, index),
            );

            tablist.append(tab);
            return tab;
          });

          this.panels = this.sections.map((section, index) => {
            const panel = document.createElement("div");
            panel.id = `${this.name}-panel-${index + 1}`;
            panel.className = "tl-tabs__panel";
            panel.setAttribute("role", "tabpanel");
            panel.setAttribute(
              "aria-labelledby",
              `${this.name}-tab-${index + 1}`,
            );
            panel.append(section.content);
            return panel;
          });

          this.replaceChildren(tablist, ...this.panels);
          this.selectTab(this.currentIndex);
        }

        // Show one panel and mark its tab as selected. Only the selected tab is in
        // the tab order; the others are reached with the arrow keys
        selectTab(index) {
          this.currentIndex = index;
          this.controls.forEach((tab, i) => {
            if (i === index) {
              tab.setAttribute("aria-selected", "true");
              tab.removeAttribute("tabindex");
            } else {
              tab.removeAttribute("aria-selected");
              tab.setAttribute("tabindex", "-1");
            }
            this.panels[i].hidden = i !== index;
          });
        }

        // Left and Right move between the tabs, wrapping at either end, and Home and
        // End jump to the first and last. The tab which receives focus is selected
        onTabKeydown(event, index) {
          const last = this.sections.length - 1;
          let next;

          switch (event.key) {
            case "ArrowLeft":
              next = index === 0 ? last : index - 1;
              break;
            case "ArrowRight":
              next = index === last ? 0 : index + 1;
              break;
            case "Home":
              next = 0;
              break;
            case "End":
              next = last;
              break;
            default:
              return;
          }

          event.preventDefault();
          this.selectTab(next);
          this.controls[next].focus();
        }

        renderAccordion() {
          const disclosures = [];
          this.controls = [];
          this.panels = [];

          this.sections.forEach((section, index) => {
            const disclosure = document.createElement("div");
            disclosure.className = "tl-tabs__disclosure";

            const toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "tl-tabs__toggle";
            toggle.setAttribute(
              "aria-controls",
              `${this.name}-panel-${index + 1}`,
            );
            // The chevron sits before the label, as it does in the accordion component
            toggle.insertAdjacentHTML("afterbegin", CHEVRON);
            toggle.append(section.label);
            toggle.addEventListener("click", () => this.toggleSection(index));

            const panel = document.createElement("div");
            panel.id = `${this.name}-panel-${index + 1}`;
            panel.className = "tl-tabs__panel";
            panel.append(section.content);

            disclosure.append(toggle, panel);
            disclosures.push(disclosure);
            this.controls.push(toggle);
            this.panels.push(panel);
          });

          this.replaceChildren(...disclosures);
          this.openSection(this.currentIndex);
        }

        // Open the section whose toggle was pressed and close the rest. Pressing the
        // toggle of the open section closes it, leaving every section closed
        toggleSection(index) {
          const open =
            this.controls[index].getAttribute("aria-expanded") === "true";
          this.openSection(open ? null : index);
        }

        // Open one section and close the others, or close them all when given null.
        // The tab layout always has a tab selected, so with every section closed it
        // falls back to the first one
        openSection(index) {
          this.currentIndex = index ?? 0;
          this.controls.forEach((toggle, i) => {
            toggle.setAttribute(
              "aria-expanded",
              i === index ? "true" : "false",
            );
            this.panels[i].hidden = i !== index;
          });
        }
      }

      if (!customElements.get("tl-tabs")) {
        customElements.define("tl-tabs", TLTabs);
      }
    </script>
  </body>
</html>
